name: CI

# One pipeline for everything:
# - Push to any branch  -> test, lint, build, then publish a test pre-release "vX.Y.Z-test.N"
#                          (only the newest few are kept).
# - Push a tag v1.2.3   -> same checks, then publish the final release "JayMusic 1.2.3" (marked
#                          Latest); all test pre-releases are deleted.
# - Run manually        -> Actions > CI > Run workflow; enter a version to publish a final release.
# - Pull request        -> checks only, nothing is published.
# The base version for test builds is appVersion in gradle.properties.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a final release with this version (e.g. 1.0.0). Leave empty to publish a test build."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KEEP_TEST_RELEASES: 5

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      kind: ${{ steps.version.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          BASE=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            case "$VERSION" in *-*) KIND=test ;; *) KIND=final ;; esac
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            KIND=final
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            VERSION="$BASE-pr.$GITHUB_RUN_NUMBER"
            KIND=none
          else
            VERSION="$BASE-test.$GITHUB_RUN_NUMBER"
            KIND=test
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version '$VERSION' is not of the form 1.2.3"
            exit 1
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION ($KIND)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private key from the repository secrets."
          else
            echo "Signing with the public development key (see docs/RELEASING.md)."
          fi

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Build APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # The run number only ever grows, so every build installs over the previous one.
        run: >
          ./gradlew :app:assembleDebug :app:assembleRelease
          -PappVersion="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"

      - name: Collect APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JayMusic-$VERSION.apk"
          (cd dist && sha256sum "JayMusic-$VERSION.apk" > "JayMusic-$VERSION.apk.sha256")

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JayMusic-debug-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  publish:
    name: Publish ${{ needs.build.outputs.kind }} release
    needs: build
    if: needs.build.outputs.kind != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      KIND: ${{ needs.build.outputs.kind }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Write release notes
        run: |
          if [ "$KIND" = "test" ]; then
            {
              echo "**Test build** of \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
              echo
              echo "Install \`JayMusic-$VERSION.apk\` on your phone to try it. Test builds are deleted"
              echo "automatically (only the newest $KEEP_TEST_RELEASES are kept, and all are removed when a final release is published)."
            } > notes.md
          else
            echo "Download \`JayMusic-$VERSION.apk\` below and open it on your phone." > notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.KIND == 'final' && format('JayMusic {0}', env.VERSION) || format('Test build {0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: ${{ env.KIND == 'final' }}
          prerelease: ${{ env.KIND == 'test' }}
          make_latest: ${{ env.KIND == 'final' }}
          files: |
            dist/JayMusic-${{ env.VERSION }}.apk
            dist/JayMusic-${{ env.VERSION }}.apk.sha256

      - name: Delete old test builds
        run: |
          # Test builds are pre-releases whose tag contains "-test.". Newest first.
          tags=$(gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-test.")))] | sort_by(.createdAt) | reverse | .[].tagName')
          if [ "$KIND" = "final" ]; then keep=0; else keep=$KEEP_TEST_RELEASES; fi
          echo "$tags" | tail -n +$((keep + 1)) | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting test build $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
