name: Release

# Publishes a signed APK as a GitHub release.
# - Push a tag:      git tag v1.2.0 && git push origin v1.2.0
# - Or run manually: Actions > Release > Run workflow (enter the version, e.g. 1.2.0)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (a tag v<version> is created)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version '$VERSION' is not of the form 1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private release key from the repository secrets."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret set; signing with the public development key (see docs/RELEASING.md)."
          fi

      - name: Test and build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :core:test :app:testReleaseUnitTest :app:assembleRelease -PappVersion="$VERSION"

      - name: Collect APK
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JayMusic-$VERSION.apk"
          (cd dist && sha256sum "JayMusic-$VERSION.apk" > "JayMusic-$VERSION.apk.sha256")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JayMusic ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            dist/JayMusic-${{ env.VERSION }}.apk
            dist/JayMusic-${{ env.VERSION }}.apk.sha256
